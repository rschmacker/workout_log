<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app draw under the iPhone notch / home bar;
         we then pad the content with the safe-area insets in index.css -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Workout Log</title>
    <meta name="description" content="Log strength sets per exercise and date." />

    <!-- Browser tab icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA manifest (name, icons, standalone display) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Status bar / browser bar color, matching the app's light and dark mode -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111827" />

    <!-- iPhone Home Screen support (Safari reads these, not the manifest icons) -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Workouts" />
    <!-- "default": iOS draws a normal status bar in the theme color, with dark or light
         text as needed ("black-translucent" always has white text, unreadable in light mode) -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
